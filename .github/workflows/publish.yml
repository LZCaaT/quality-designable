name: Publish packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout designable
        uses: actions/checkout@v6
        with:
          path: quality-designable

      - name: Checkout antd v6 components
        uses: actions/checkout@v6
        with:
          repository: LZCaaT/quality-formily-antd-v6
          ref: feat/quality-scope
          path: quality-formily-antd-v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: quality-designable/package-lock.json

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Resolve release channel
        id: release
        working-directory: quality-designable
        shell: bash
        run: |
          VERSION="$(node -p "require('./lerna.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          fi

          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${VERSION} to npm channel ${DIST_TAG}."

      - name: Install antd v6 dependencies
        working-directory: quality-formily-antd-v6
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build antd v6 components
        working-directory: quality-formily-antd-v6
        run: npm run build --workspace @designable-next/formily-antd-v6

      - name: Install dependencies
        working-directory: quality-designable
        run: npm install --ignore-scripts

      - name: Build packages
        working-directory: quality-designable
        run: npm run build

      - name: Publish packages
        working-directory: quality-designable
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --workspaces --if-present --tag "${DIST_TAG}" --provenance
